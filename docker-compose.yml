version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: empyrict-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: empyrict_ai

  app:
    build: .
    container_name: empyrict-app
    restart: always
    ports:
      - "5000:5000"
      - "5173:5173"
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/empyrict_ai
      - JWT_SECRET=empyrict_ai_secure_jwt_token_secret_key_2026
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ML_SERVICE_URL=http://localhost:8000
      - CLIENT_URL=http://localhost:5173

volumes:
  mongo_data:
